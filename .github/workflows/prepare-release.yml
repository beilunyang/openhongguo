# Prepares and tags a release. Run it by hand on main with a version.
#
# The build job sets every platform's version, builds the native libraries
# once, runs the tests, and writes the xcframework's checksum into
# Package.swift. Nothing leaves the run until the tag job, which waits for
# approval in the release environment and then commits, tags, pushes, and
# creates the GitHub Release with the xcframework zip and the native
# libraries. The tag push starts publish.yml and the Release starts
# release.yml. A dry run stops after the build job and keeps its output as an
# artifact.
#
# The tag job pushes with RELEASE_TOKEN, a fine-grained token for this
# repository with Contents read and write: a push made with GITHUB_TOKEN
# starts no other workflow.
name: prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, such as 0.3.0 (no leading v)
        required: true
      dry_run:
        description: Build and test only; no commit, tag or release
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Keep in step with ci.yml.
  GOMOBILE_VERSION: v0.0.0-20261011034528-197770444867
  VERSION: ${{ inputs.version }}
  TAG: v${{ inputs.version }}

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check the inputs
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::version must look like X.Y.Z"; exit 1; }
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::run this workflow on main"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Refuse an existing tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG already exists"
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: bindings/mobile/core/go.mod
          cache-dependency-path: bindings/mobile/core/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@$GOMOBILE_VERSION golang.org/x/mobile/cmd/gobind@$GOMOBILE_VERSION
          gomobile init
      - run: scripts/set-version.sh "$VERSION"
      # Builds the Go core for Android and iOS once, puts it into every
      # package, and runs the Kotlin unit tests.
      - run: bindings/mobile/build.sh all
      - run: make test
      - run: swift test
        working-directory: bindings/mobile/ios
      - name: Package the xcframework and write its checksum
        run: |
          mkdir -p "dist/$TAG"
          (cd bindings/mobile/ios && ditto -c -k --sequesterRsrc --keepParent \
            OpenhongguoCore.xcframework "../../../dist/$TAG/OpenhongguoCore.xcframework.zip")
          sum=$(swift package compute-checksum "dist/$TAG/OpenhongguoCore.xcframework.zip")
          SUM=$sum perl -pi -e 's/checksum: "[0-9a-f]{64}"/checksum: "$ENV{SUM}"/' Package.swift
          grep -qF "checksum: \"$sum\"" Package.swift
          scripts/set-version.sh --check "$VERSION"
      # The packages publish.yml builds take these instead of building the
      # core again, so every platform ships the same build. A tarball keeps
      # the xcframework's layout intact.
      - name: Pack the native libraries
        run: |
          tar -czf "dist/$TAG/natives.tgz" \
            bindings/mobile/android/libs bindings/mobile/android/src/main/jniLibs \
            bindings/react-native/android/libs bindings/react-native/android/src/main/jniLibs \
            bindings/react-native/ios/OpenhongguoCore.xcframework \
            bindings/flutter/android/libs bindings/flutter/android/src/main/jniLibs \
            bindings/flutter/ios/OpenhongguoCore.xcframework
          git diff > "dist/$TAG/release.patch"
          git diff --stat
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ env.TAG }}
          path: dist/${{ env.TAG }}
          retention-days: 7
          if-no-files-found: error

  tag:
    if: ${{ !inputs.dry_run }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Waits for a reviewer's approval; RELEASE_TOKEN is an environment secret.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          persist-credentials: true
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-${{ env.TAG }}
          path: dist
      - name: Commit, tag and push
        run: |
          git apply --index dist/release.patch
          scripts/set-version.sh --check "$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "release: $TAG"
          git tag -a "$TAG" -m "$TAG"
          # Fails without pushing either ref when main moved since the build.
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$TAG"
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          gh release create "$TAG" dist/OpenhongguoCore.xcframework.zip dist/natives.tgz \
            --title "$TAG" --generate-notes --verify-tag
