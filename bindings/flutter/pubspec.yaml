name: openhongguo
description: 红果短剧（Hongguo）的非官方 Flutter SDK：匿名浏览、搜索与播放，基于 Go SDK 编译的原生库。
version: 0.2.0
repository: https://github.com/beilunyang/openhongguo/tree/main/bindings/flutter
issue_tracker: https://github.com/beilunyang/openhongguo/issues
topics:
  - hongguo
  - short-drama
  - sdk

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.openhongguo.flutter
        pluginClass: OpenhongguoPlugin
      ios:
        pluginClass: OpenhongguoPlugin
