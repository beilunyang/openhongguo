plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.openhongguo'
version = '0.2.0'

android {
  namespace "dev.openhongguo.reactnative"
  defaultConfig {
    versionCode 1
    versionName "0.2.0"
    // 原生代码按名字调用 gomobile 的 Java 类，App 混淆时必须保留。
    consumerProguardFiles 'consumer-rules.pro'
  }
}

dependencies {
  // gomobile 编译的 Go core（dev.openhongguo.core 和 go.*），由 bindings/mobile/build.sh 放进来。
  implementation files('libs/core.jar')
}
